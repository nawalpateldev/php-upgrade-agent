; ====================================================================
; PHP Hardened Runtime Configuration (php2shell Remediation Profile)
; Prevents OS command injection, webshell execution, and memory exploitation
; ====================================================================

[PHP]
; 1. Disable dangerous shell and process execution primitives
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,eval,assert,dl,apache_child_terminate,apache_setenv,virtual,mb_send_mail

; 2. Restrict wrapper protocols (blocks remote file inclusion & remote filter chains)
allow_url_fopen = Off
allow_url_include = Off

; 3. Enforce strict filesystem jail (prevents path traversal to /etc, /var/log, or temp directories)
; Adjust path according to your production root
open_basedir = /var/www/html/:/tmp/

; 4. Hide PHP identity from fingerprinting
expose_php = Off

; 5. Strict error reporting (log errors, never display in HTTP response)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; 6. File Upload Hardening
file_uploads = On
upload_tmp_dir = /tmp/
upload_max_filesize = 10M
max_file_uploads = 10

; 7. Session Security
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Strict"
