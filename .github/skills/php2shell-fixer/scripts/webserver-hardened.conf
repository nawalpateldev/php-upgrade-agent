# ====================================================================
# Web Server Hardening Rules for PHP (Nginx & Apache)
# Neutralizes CGI Argument Injection (CVE-2024-4577 & Oct 2026 variants),
# path traversal, and unauthorized script execution.
# ====================================================================

# --------------------------------------------------------------------
# 1. NGINX CONFIGURATION SNIPPET
# --------------------------------------------------------------------
# Add inside your server {} or location ~ \.php$ block:

# Block query string argument injection targeting PHP-CGI (CVE-2024-4577 & 2026 Unicode bypasses)
if ($query_string ~* "(\-d|\-\-define|\-s|\-w|\-b|\-c|\-n)") {
    return 403;
}
# Block soft-hyphen / best-fit mapping bypasses (%ad, %u00ad, %ff)
if ($query_string ~* "(%ad|%u00ad|%ff)") {
    return 403;
}

# Prevent execution of PHP scripts in public uploads / assets directories
location ~* /(uploads|storage|media|assets|public/files)/.*\.php$ {
    deny all;
    return 404;
}

# Strict FastCGI handling
location ~ \.php$ {
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    try_files $fastcgi_script_name =404;
    fastcgi_pass unix:/var/run/php/php8.3-fpm.sock; # Or your FPM address
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    
    # Do not pass arbitrary proxy headers
    fastcgi_param HTTP_PROXY "";
}

# --------------------------------------------------------------------
# 2. APACHE CONFIGURATION SNIPPET (.htaccess or VirtualHost)
# --------------------------------------------------------------------
<IfModule mod_rewrite.c>
    RewriteEngine On

    # Neutralize CGI argument injection (CVE-2024-4577 / October 2026 bypasses)
    RewriteCond %{QUERY_STRING} ^.*(-d|--define|-s|-w|-b|-c|-n).* [NC,OR]
    RewriteCond %{QUERY_STRING} ^.*(%ad|%u00ad|%ff).* [NC]
    RewriteRule .* - [F,L]

    # Forbid direct execution of any script uploaded in storage/uploads
    RewriteRule ^(uploads|storage|media)/.*\.php$ - [F,L]
</IfModule>

# Forbid access to sensitive system and environment files
<FilesMatch "^\.(env|git|htaccess|htpasswd|user\.ini)">
    Require all denied
</FilesMatch>
